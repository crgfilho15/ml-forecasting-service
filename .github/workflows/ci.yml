name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t energy-forecasting-api:ci api

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8002:8002 energy-forecasting-api:ci
          for _ in $(seq 1 15); do
            curl --fail --silent http://localhost:8002/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
